services:
    app:
        build: .
        ports:
            - "3001:3000"
        env_file:
            - .env
        develop:
            watch:
                - action: sync
                  path: ./
                  target: /app
                  ignore:
                      - node_modules
                      - .git
        entrypoint: "nodemon index.js"
